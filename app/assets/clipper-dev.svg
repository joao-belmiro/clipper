<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra Externa Pesada Expandida (Fim das bordas cortadas/pixeladas) -->
    <filter id="shadow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Sombra Interna da Tela/Papel -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="8"/>
      <feGaussianBlur stdDeviation="12" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.95" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Brilho Dourado Lendário (Viés de Confirmação Premium) -->
    <filter id="legendary-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Brilho externo amplo (Âmbar) -->
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.85"/>
      <!-- Brilho interno focado (Amarelo Solar) -->
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fef08a" flood-opacity="0.7"/>
    </filter>

    <!-- Gradiente da Prancheta (Carcaça Matte Escura) -->
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" /> 
      <stop offset="100%" stop-color="#18181b" /> 
    </linearGradient>

    <!-- Gradiente da Presilha (Titânio/Gunmetal) para destacar o Dourado -->
    <linearGradient id="clip-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa" /> 
      <stop offset="100%" stop-color="#3f3f46" /> 
    </linearGradient>
    
    <!-- Gradiente do Checkmark (Legendary Gold) -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" /> <!-- Amarelo Brilhante -->
      <stop offset="40%" stop-color="#f59e0b" /> <!-- Âmbar Médio -->
      <stop offset="100%" stop-color="#b45309" /> <!-- Bronze Profundo -->
    </linearGradient>
  </defs>

  <!-- ============================================== -->
  <!-- 1. CORPO DA PRANCHETA (BASE HARDWARE MATTE)    -->
  <!-- ============================================== -->
  <rect x="76" y="96" width="360" height="380" rx="48" fill="url(#board-grad)" filter="url(#shadow-heavy)" />
  
  <!-- Highlight do Bevel (Simula a curva da luz na borda do plástico) -->
  <rect x="80" y="100" width="352" height="372" rx="44" fill="none" stroke="#52525b" stroke-width="4" stroke-opacity="0.8" />
  <rect x="76" y="96" width="360" height="380" rx="48" fill="none" stroke="#000000" stroke-width="8" stroke-opacity="0.6" />

  <!-- ============================================== -->
  <!-- 2. "PAPEL" / TELA (CAVIDADE EMBUTIDA LISA)     -->
  <!-- ============================================== -->
  <!-- Fundo escuro rebaixado 100% liso (Sem texturas para evitar pixelização) -->
  <rect x="108" y="160" width="296" height="280" rx="24" fill="#09090b" filter="url(#inner-shadow)" />

  <!-- Linhas estruturais opacas muito sutis (Scanlines polidas) -->
  <line x1="128" y1="210" x2="384" y2="210" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.02" />
  <line x1="128" y1="260" x2="384" y2="260" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.02" />
  <line x1="128" y1="310" x2="384" y2="310" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.02" />
  <line x1="128" y1="360" x2="384" y2="360" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.02" />

  <!-- ============================================== -->
  <!-- 3. PRESILHA DO CLIPBOARD (TITÂNIO NEUTRO)      -->
  <!-- ============================================== -->
  <!-- Argola de pendurar (Hardware Ring) -->
  <path d="M 216 56 C 216 10, 296 10, 296 56" fill="none" stroke="url(#clip-grad)" stroke-width="20" stroke-linecap="round" filter="url(#shadow-heavy)" />
  
  <!-- Corpo principal da presilha metálica -->
  <rect x="146" y="56" width="220" height="72" rx="24" fill="url(#clip-grad)" filter="url(#shadow-heavy)" />
  
  <!-- Reflexo Rígido no topo da presilha (Luz Direta) -->
  <rect x="156" y="62" width="200" height="8" rx="4" fill="#ffffff" fill-opacity="0.25" />
  
  <!-- Detalhes Mecânicos (Parafusos de fixação) -->
  <circle cx="186" cy="92" r="8" fill="#000000" fill-opacity="0.7" />
  <circle cx="326" cy="92" r="8" fill="#000000" fill-opacity="0.7" />

  <!-- ============================================== -->
  <!-- 4. SÍMBOLO DE CONFIRMAÇÃO (LEGENDARY GOLD)     -->
  <!-- ============================================== -->
  <!-- Sombras Luminosas projetadas em Âmbar e Amarelo -->
  <g filter="url(#legendary-glow)">
    <path d="M 175 290 L 235 345 L 340 205" 
          fill="none" stroke="url(#gold-grad)" stroke-width="44" 
          stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Núcleo do Check (Luz Branca Incandescente centralizada) -->
  <path d="M 175 290 L 235 345 L 340 205" 
        fill="none" stroke="#ffffff" stroke-width="14" 
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.65" />

</svg>
