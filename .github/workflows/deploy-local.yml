name: 🚀 Build & Deploy to Local Nginx

# Para usar SSH para conectar na VPS e copiar com cp/rsync
# Esta é a versão usando cp para copiar os arquivos

on:
  push:
    branches: [master]
  workflow_dispatch: # Permite disparo manual via GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Faz checkout do código
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 2. Configura Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # 3. Instala as dependências
      - name: 📦 Install dependencies
        run: npm ci
      
      # 4. Faz o build da aplicação
      - name: 🏗️ Build application
        run: npm run build
      
      # 5. Configura SSH para deploy
      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      # 6. Faz deploy dos arquivos para a VPS usando cp via SSH
      - name: 📤 Deploy to Nginx (via SSH + cp)
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "rm -rf /opt/nginx/html/retro-clipper/* && mkdir -p /opt/nginx/html/retro-clipper/"
          
          scp -i ~/.ssh/id_rsa -r .output/public/* \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nginx/html/retro-clipper/
      
      # 7. Notificação de sucesso (opcional)
      - name: ✅ Deployment successful
        if: success()
        run: echo "✅ Deploy concluído com sucesso em $(date)"
      
      # 8. Notificação de erro (opcional)
      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ Deploy falhou"
          exit 1
