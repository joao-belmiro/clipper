name: 🚀 Build & Deploy to VPS Nginx (SCP)

# Esta variante envia os arquivos estáticos para uma VPS remota usando SSH e SCP.

on:
  push:
    branches: [master]
  workflow_dispatch: # Permite disparo manual via GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Faz checkout do código
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 2. Configura Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # 3. Instala as dependências
      - name: 📦 Install dependencies
        run: npm ci
      
      # 4. Faz o build da aplicação
      - name: 🏗️ Build application
        run: npm run build
      
      # 5. Configura SSH para deploy
      - name: 🔐 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      
      # 6. Faz deploy dos arquivos para a VPS via SSH e SCP
      - name: 📤 Deploy to Nginx (via SSH + SCP)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          SSH_OPTS="-o IdentitiesOnly=yes -o BatchMode=yes -i $HOME/.ssh/id_rsa"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "mkdir -p /opt/nginx/html/retro-clipper && rm -rf /opt/nginx/html/retro-clipper/*"
          
          scp $SSH_OPTS -r .output/public/* \
            "$VPS_USER@$VPS_HOST:/opt/nginx/html/retro-clipper/"
      
      # 7. Notificação de sucesso (opcional)
      - name: ✅ Deployment successful
        if: success()
        run: echo "✅ Deploy concluído com sucesso em $(date)"
      
      # 8. Notificação de erro (opcional)
      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ Deploy falhou"
          exit 1
