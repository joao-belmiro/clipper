name: 🚀 Build & Deploy to VPS

# Workflow alternativo com rsync; execute manualmente para evitar deploy duplicado.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Faz checkout do código
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 2. Configura Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # 3. Instala as dependências
      - name: 📦 Install dependencies
        run: npm ci
      
      # 4. Faz o build da aplicação
      - name: 🏗️ Build application
        run: npm run build
      
      # 5. Configura SSH para deploy
      - name: 🔐 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Falha aqui se a chave do Secret estiver malformada
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      
      # 6. Faz deploy dos arquivos para a VPS
      - name: 📤 Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes" \
            .output/public/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
      
      # 7. Notificação de sucesso (opcional)
      - name: ✅ Deployment successful
        if: success()
        run: echo "✅ Deploy concluído com sucesso em $(date)"
      
      # 8. Notificação de erro (opcional)
      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ Deploy falhou"
          exit 1
