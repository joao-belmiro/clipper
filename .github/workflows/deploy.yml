name: 🚀 Build & Deploy to VPS

# Workflow alternativo com rsync; execute manualmente para evitar deploy duplicado.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Faz checkout do código
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 2. Configura Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # 3. Instala as dependências
      - name: 📦 Install dependencies
        run: npm ci
      
      # 4. Faz o build da aplicação
      - name: 🏗️ Build application
        run: npm run build
      
      # 5. Configura SSH para deploy
      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      # 6. Faz deploy dos arquivos para a VPS
      - name: 📤 Deploy to VPS
        run: |
          rsync -avz --delete .output/public/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/
      
      # 7. Notificação de sucesso (opcional)
      - name: ✅ Deployment successful
        if: success()
        run: echo "✅ Deploy concluído com sucesso em $(date)"
      
      # 8. Notificação de erro (opcional)
      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ Deploy falhou"
          exit 1
